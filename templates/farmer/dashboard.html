{# ============================================================
   templates/farmer/dashboard.html — FarmLink Intelligence

   CSS:  public.css → farmer.css
   Zero <style> blocks. Zero inline styles except SVG dashoffset.
   Zero float/round/math. Zero ORM calls. Zero queries.

   All context pre-computed in routes/farmer.py → dashboard():
     farmer               User
     now                  datetime
     farms                list[Farm]
     selected_farm        Farm|None
     latest_reading       SensorReading|None
     sensor_status        str  — 'online'|'warning'|'offline'|'no-data'
     last_reading_ago     str
     quality_score        int|None
     quality_detail       dict  — {label: 'Good'|'Fair'|'Poor'}
     sensor_rows          list[dict]  — label,display,pct,bar_css
     trust_score_display  str|None
     trust_score_css      str|None
     active_forecast      HarvestForecast|None
     harvest_days         int|None
     harvest_days_css     str
     active_listings      list[ProduceListing]
     active_count         int
     listings_with_forecast int
     alerts_display       list[dict]  — message,time,dot_css
     unread_notifs        int
     active_page          str
   ============================================================ #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · FarmLink Intelligence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/farmer.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/partials.css') }}">
</head>
<body class="portal-body">

{# ════ TOPBAR ════════════════════════════════════════════════ #}
<header class="topbar" role="banner">
  <div class="topbar-left">
    <a href="{{ url_for('public.landing') }}" class="topbar-logo" aria-label="FarmLink home">
      <div class="topbar-mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <span class="topbar-brand">FarmLink Intelligence</span>
    </a>
    <div class="topbar-vr" aria-hidden="true"></div>
    <span class="topbar-portal-tag">Farmer Portal</span>
  </div>
  <div class="topbar-right">
    <a href="{{ url_for('farmer.notifications') }}" class="topbar-notif"
       aria-label="Notifications{% if unread_notifs %} — {{ unread_notifs }} unread{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      {% if unread_notifs and unread_notifs > 0 %}
        <span class="notif-badge" aria-hidden="true">{{ unread_notifs if unread_notifs <= 9 else '9+' }}</span>
      {% endif %}
    </a>
    <span class="topbar-username">{{ farmer.full_name }}</span>
    <div class="topbar-avatar" title="{{ farmer.full_name }}" aria-hidden="true">
      {{ farmer.full_name[:2].upper() }}
    </div>
    <a href="{{ url_for('auth.logout') }}" class="topbar-logout">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Log out
    </a>
  </div>
</header>

{# ════ FLASH ═════════════════════════════════════════════════ #}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack" role="alert" aria-live="polite">
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{# ════ LAYOUT ════════════════════════════════════════════════ #}
<div class="portal-layout">

  {% include 'partials/sidebar_farmer.html' %}

  <main class="portal-main" id="main" role="main">

    {# ── Banners ─────────────────────────────────────────── #}
    {% if sensor_status == 'offline' %}
      <div class="banner bn-offline" role="alert">
        <span>Sensor offline — last reading {{ last_reading_ago }}. Showing last known values.</span>
        <a href="{{ url_for('farmer.farms') }}">Check farm</a>
      </div>
    {% elif sensor_status == 'warning' %}
      <div class="banner bn-offline" role="alert">
        <span>Sensor intermittent — some readings were missed.</span>
      </div>
    {% endif %}
    {% if not farmer.is_verified %}
      <div class="banner bn-info" role="alert">
        <span>Account pending admin verification. Some features may be limited.</span>
      </div>
    {% endif %}

    {# ── Page header ─────────────────────────────────────── #}
    <div class="page-hd">
      <h1 class="page-greeting">
        Good
        {% if now.hour < 12 %}morning{% elif now.hour < 17 %}afternoon{% else %}evening{% endif %},
        {{ farmer.full_name.split()[0] }}
      </h1>

      <div class="page-status-line">
        {% if latest_reading %}
          <span class="status-dot {{ sensor_status }}" aria-hidden="true"></span>
          <span>Sensor {{ sensor_status }}</span>
          <span aria-hidden="true">·</span>
          <span>Updated {{ last_reading_ago }}</span>
        {% elif farms %}
          <span>No readings yet — connect your sensor node to get started.</span>
        {% else %}
          <span>Welcome to FarmLink — add your first farm to begin.</span>
        {% endif %}
      </div>

      {% if farms %}
        <div class="farm-selector">
          <label for="farm-sel" class="sr-only">Select farm</label>
          <select id="farm-sel" class="farm-select" onchange="switchFarm(this.value)">
            {% for f in farms %}
              <option value="{{ f.id }}"
                {% if selected_farm and f.id == selected_farm.id %}selected{% endif %}>
                {{ f.name }}{% if f.region %} — {{ f.region }}{% endif %}{% if f.town %}, {{ f.town }}{% endif %}
              </option>
            {% endfor %}
          </select>
          <a href="{{ url_for('farmer.add_farm') }}" class="btn-addfarm">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add farm
          </a>
        </div>
      {% endif %}
    </div>

    {# ── No farms empty state ────────────────────────────── #}
    {% if not farms %}
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <p class="empty-title">No farms yet</p>
          <p class="empty-sub">Add your first farm to link your IoT sensor node and start tracking your quality score in real time.</p>
          <a href="{{ url_for('farmer.add_farm') }}" class="btn-addfarm">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add first farm
          </a>
        </div>
      </div>

    {% else %}

    {# ════ ROW 1 — KPI tiles ═════════════════════════════════ #}
    <section aria-label="Key metrics">
      <div class="kpi-row">

        <div class="kpi kp-green">
          <div class="kpi-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div class="kpi-label">Quality score</div>
          {% if quality_score is not none %}
            <div class="kpi-value {% if quality_score >= 70 %}kv-green{% elif quality_score >= 40 %}kv-amber{% else %}kv-danger{% endif %}">
              {{ quality_score }}
            </div>
            <div class="kpi-sub">out of 100</div>
          {% else %}
            <div class="kpi-value kv-muted">—</div>
            <div class="kpi-sub">awaiting sensor data</div>
          {% endif %}
        </div>

        <div class="kpi kp-teal">
          <div class="kpi-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="kpi-label">Trust score</div>
          {% if trust_score_display %}
            <div class="kpi-value {{ trust_score_css }}">{{ trust_score_display }}</div>
            <div class="kpi-sub">out of 5.0</div>
          {% else %}
            <div class="kpi-value kv-muted">—</div>
            <div class="kpi-sub">no transactions yet</div>
          {% endif %}
        </div>

        <div class="kpi kp-blue">
          <div class="kpi-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          </div>
          <div class="kpi-label">Active listings</div>
          <div class="kpi-value">{{ active_count }}</div>
          <div class="kpi-sub">
            {% if listings_with_forecast > 0 %}{{ listings_with_forecast }} with forecast{% else %}produce listed{% endif %}
          </div>
        </div>

        <div class="kpi kp-amber">
          <div class="kpi-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="kpi-label">Harvest countdown</div>
          {% if harvest_days is not none %}
            <div class="kpi-value {{ harvest_days_css }}">{{ harvest_days }}d</div>
            <div class="kpi-sub">est. ready</div>
          {% elif active_forecast %}
            <div class="kpi-value kv-green">Active</div>
            <div class="kpi-sub">forecast running</div>
          {% else %}
            <div class="kpi-value kv-muted">—</div>
            <div class="kpi-sub">28 days data needed</div>
          {% endif %}
        </div>

      </div>
    </section>

    {# ════ ROW 2 — Sensor readings + Quality score ════════════ #}
    <div class="grid-2">

      <section class="card" aria-label="Live sensor readings">
        <div class="card-hd">
          <div>
            <div class="card-title">Live sensor readings</div>
            <div class="card-sub">
              {% if latest_reading %}Updated {{ last_reading_ago }}{% else %}No data yet{% endif %}
            </div>
          </div>
          <a href="{{ url_for('farmer.farms') }}" class="card-link">My farms ↗</a>
        </div>

        {# sensor_rows is a list of pre-computed dicts from the route #}
        {% if sensor_rows %}
          {% for row in sensor_rows %}
            <div class="sr-row">
              <span class="sr-label">{{ row.label }}</span>
              <div class="sr-right">
                <span class="sr-val">{{ row.display }}</span>
                {% if row.pct is not none %}
                  <div class="sr-bar" aria-hidden="true">
                    <div class="sr-bar-fill {{ row.bar_css }}" style="width:{{ row.pct }}%"></div>
                  </div>
                {% else %}
                  <span class="rain-pill {{ row.bar_css }}">{{ row.display }}</span>
                {% endif %}
              </div>
            </div>
          {% endfor %}
        {% else %}
          {% for lbl in ['Soil moisture', 'Temperature', 'Humidity', 'Light intensity', 'Rainfall'] %}
            <div class="sr-row">
              <span class="sr-label">{{ lbl }}</span>
              <div class="sr-right"><span class="sr-val">—</span></div>
            </div>
          {% endfor %}
        {% endif %}

        {% if sensor_status == 'offline' %}
          <p class="offline-note" role="alert">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Last known values · offline {{ last_reading_ago }}
          </p>
        {% endif %}
      </section>

      <section class="card" aria-label="Quality score breakdown">
        <div class="card-hd">
          <div>
            <div class="card-title">Quality score</div>
            <div class="card-sub">IoT-verified · computed every 30 min</div>
          </div>
        </div>

        {% set score = quality_score if quality_score is not none else 0 %}
        {% set circ  = 2 * 3.14159 * 38 %}
        {% set offs  = circ - (score / 100 * circ) %}
        <div class="ring-wrap">
          <div class="ring" role="img" aria-label="Quality score {{ score }} out of 100">
            <svg width="92" height="92" viewBox="0 0 92 92">
              <circle class="ring-track" cx="46" cy="46" r="38"/>
              <circle class="ring-fill {% if score < 40 %}r-danger{% elif score < 70 %}r-warn{% endif %}"
                cx="46" cy="46" r="38"
                stroke-dasharray="{{ circ | round(2) }}"
                stroke-dashoffset="{{ offs | round(2) }}"
                id="score-ring"/>
            </svg>
            <div class="ring-center">
              <span class="ring-num">{% if quality_score is not none %}{{ quality_score }}{% else %}—{% endif %}</span>
              <span class="ring-denom">/ 100</span>
            </div>
          </div>
        </div>

        {# quality_detail is fully populated in route — no fallback logic needed #}
        {% if quality_detail %}
          {% for lbl, rat in quality_detail.items() %}
            <div class="q-row">
              <span class="q-key">{{ lbl }}</span>
              <span class="q-pill {{ rat | lower }}">{{ rat }}</span>
            </div>
          {% endfor %}
        {% else %}
          <p class="empty-sub" style="text-align:center;padding:12px 0">
            Ratings appear once your sensor sends data.
          </p>
        {% endif %}

        <div class="trend-slot">7-day trend — Stage 5</div>
      </section>
    </div>

    {# ════ ROW 3 — Forecast + Alerts ════════════════════════ #}
    <div class="grid-2">

      <section class="card" aria-label="Harvest forecast">
        <div class="card-hd">
          <div>
            <div class="card-title">Harvest forecast</div>
            <div class="card-sub">Auto-generated after 28+ days of sensor data</div>
          </div>
          {% if active_forecast %}
            <a href="{{ url_for('farmer.forecast_detail', forecast_id=active_forecast.id) }}"
               class="card-link">View detail ↗</a>
          {% endif %}
        </div>

        {% if active_forecast %}
          <div class="fc-tag ft-active">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            Forecast active
          </div>
          <div class="fc-grid">
            <div>
              <div class="fc-key">Crop</div>
              <div class="fc-val">{{ selected_farm.crop_type if selected_farm else '—' }}</div>
            </div>
            <div>
              <div class="fc-key">Confidence</div>
              <div class="fc-val">{{ active_forecast.confidence_score | round | int }}%</div>
            </div>
            <div>
              <div class="fc-key">Harvest window</div>
              <div class="fc-val">
                {{ active_forecast.predicted_harvest_start.strftime('%b %d') }} –
                {{ active_forecast.predicted_harvest_end.strftime('%b %d') }}
              </div>
            </div>
            <div>
              <div class="fc-key">Buyers alerted</div>
              <div class="fc-val">{{ active_forecast.buyers_alerted }}</div>
            </div>
          </div>
          <div class="trend-slot">Trend chart — Stage 7</div>
        {% else %}
          <div class="fc-tag ft-pending">Not yet available</div>
          <div class="fc-empty">
            Forecast generates automatically once your sensor collects 28 consecutive days of readings.
            <small>{% if latest_reading %}Keep your node running.{% else %}Connect your sensor node to start.{% endif %}</small>
          </div>
        {% endif %}
      </section>

      <section class="card" aria-label="Recent alerts">
        <div class="card-hd">
          <div class="card-title">Recent alerts</div>
          <a href="{{ url_for('farmer.notifications') }}" class="card-link">View all ↗</a>
        </div>

        {# alerts_display is pre-built in route — dot_css already computed #}
        {% if alerts_display %}
          {% for a in alerts_display %}
            <div class="al-row">
              <div class="al-dot {{ a.dot_css }}" aria-hidden="true"></div>
              <div class="al-body">
                <div class="al-msg">{{ a.message }}</div>
                <div class="al-time">{{ a.time }}</div>
              </div>
            </div>
          {% endfor %}
        {% else %}
          <div class="al-empty" role="status">No alerts yet.</div>
        {% endif %}
      </section>

    </div>

    {# ════ ROW 4 — Active listings ═══════════════════════════ #}
    <section class="card" aria-label="My active listings">
      <div class="card-hd">
        <div class="card-title">My active listings</div>
        <a href="{{ url_for('farmer.listings') }}" class="card-link">View all ↗</a>
      </div>

      {% if active_listings %}
        {% for l in active_listings %}
          <div class="ls-row">
            <div>
              <div class="ls-crop">{{ l.crop_type }} — {{ l.quantity_kg | round | int }} kg</div>
              <div class="ls-meta">
                <span>Quality {{ l.quality_score_live }}</span>
                <span>·</span>
                <span>Trust {{ trust_score_display if trust_score_display else '—' }}</span>
                {% if l.forecast_id %}<span class="tag tag-forecast">Forecast</span>{% endif %}
              </div>
            </div>
            <div class="ls-right">
              <span class="ls-price">XAF {{ "{:,.0f}".format(l.price_per_kg | float) }}/kg</span>
              <div class="ls-status"><span class="tag tag-active">Active</span></div>
            </div>
          </div>
        {% endfor %}
      {% else %}
        <div class="ls-empty">
          <div class="ls-empty-title">No active listings</div>
          <div class="ls-empty-sub">
            {% if quality_score and quality_score > 0 %}
              Your quality score is {{ quality_score }} — create a listing to reach buyers.
            {% else %}
              Your quality score will be computed once your sensor sends data.
            {% endif %}
          </div>
        </div>
      {% endif %}

      <a href="{{ url_for('farmer.new_listing') }}" class="btn-newlisting">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Create new listing
      </a>
    </section>

    {% endif %}{# /if farms #}

  </main>
</div>

<script>
  function switchFarm(id) {
    var u = new URL(location.href);
    u.searchParams.set('farm_id', id);
    location.href = u.toString();
  }

  document.querySelectorAll('.flash').forEach(function(el) {
    setTimeout(function() {
      el.classList.add('out');
      setTimeout(function() { el.remove(); }, 200);
    }, 5000);
  });

  (function() {
    var el = document.getElementById('score-ring');
    if (!el) return;
    var target = parseFloat(el.getAttribute('stroke-dashoffset'));
    var total  = parseFloat(el.getAttribute('stroke-dasharray'));
    el.style.transition = 'none';
    el.setAttribute('stroke-dashoffset', total);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        el.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(0.4,0,0.2,1)';
        el.setAttribute('stroke-dashoffset', target);
      });
    });
  }());
</script>
</body>
</html>
